<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Рассылки{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Рассылки</a>
            <div class="navbar-nav">
                 <a class="nav-link" href="{% url 'mailing:index' %}">Главная</a>
                <a class="nav-link" href="{% url 'mailing:recipient_list' %}">Получатели</a>
                <a class="nav-link" href="{% url 'mailing:message_list' %}">Сообщения</a>
                <a class="nav-link" href="{% url 'mailing:mailing_list' %}">Рассылки</a>
                <a class="nav-link" href="{% url 'mailing:statistics' %}">Статистика</a>
            </div>
            <div class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <span class="nav-link text-light">{{ user.email }}</span>
                    <form method="post" action="{% url 'users:logout' %}" style="display: inline;">
                        {% csrf_token %}
                        <button type="submit" class="nav-link btn btn-link" style="color: rgba(255,255,255,.55); text-decoration: none; background: none; border: none; padding: 0; cursor: pointer;">Выйти</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="{% url 'users:register' %}">Регистрация</a>
                    <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
                    <a href="{% url 'users:password_reset' %}">Забыли пароль?</a>

                {% endif %}
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
