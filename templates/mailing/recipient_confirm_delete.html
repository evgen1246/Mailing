{% extends 'base.html' %}

{% block title %}Удаление получателя{% endblock %}

{% block content %}
<h2>Удалить получателя?</h2>
<p>Вы уверены, что хотите удалить <strong>{{ recipient.full_name }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'mailing:recipient_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
