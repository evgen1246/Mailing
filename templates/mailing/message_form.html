{% extends 'base.html' %}

{% block title %}{% if object %}Редактирование{% else %}Новое сообщение{% endif %}{% endblock %}

{% block content %}
<h2>{% if object %}Редактирование{% else %}Новое сообщение{% endif %}</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить</button>
    <a href="{% url 'mailing:message_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
