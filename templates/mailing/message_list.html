{% extends 'base.html' %}

{% block title %}Сообщения{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Сообщения</h2>
    <a href="{% url 'mailing:message_create' %}" class="btn btn-primary">+ Создать</a>
</div>

<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>Тема</th>
            <th>Дата создания</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for message in messages %}
        <tr>
            <td>{{ message.subject }}</td>
            <td>{{ message.created_at|date:"d.m.Y H:i" }}</td>
            <td>
                <a href="{% url 'mailing:message_update' message.pk %}" class="btn btn-sm btn-warning">Изм.</a>
                <a href="{% url 'mailing:message_delete' message.pk %}" class="btn btn-sm btn-danger">Уд.</a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-center">Нет сообщений</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
