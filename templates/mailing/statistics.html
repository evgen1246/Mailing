{% extends 'base.html' %}

{% block title %}Статистика{% endblock %}

{% block content %}
<h2 class="mb-4">Статистика</h2>

<div class="row">
    <div class="col-md-4">
        <div class="card text-center bg-success text-white">
            <div class="card-body">
                <h3>{{ stats.successful_attempts }}</h3>
                <p class="mb-0">Успешных отправок</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center bg-danger text-white">
            <div class="card-body">
                <h3>{{ stats.failed_attempts }}</h3>
                <p class="mb-0">Неуспешных отправок</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center bg-primary text-white">
            <div class="card-body">
                <h3>{{ stats.sent_messages }}</h3>
                <p class="mb-0">Отправлено сообщений</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
