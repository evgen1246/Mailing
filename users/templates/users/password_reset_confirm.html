{% extends 'base.html' %}

{% block title %}Сброс пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Сброс пароля</h3>
            </div>
            <div class="card-body">
                {% if validlink %}
                    <p class="text-muted">Введите новый пароль.</p>
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label for="id_new_password1" class="form-label">Новый пароль</label>
                            <input type="password" name="new_password1" id="id_new_password1" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label for="id_new_password2" class="form-label">Подтверждение пароля</label>
                            <input type="password" name="new_password2" id="id_new_password2" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">Сменить пароль</button>
                    </form>
                {% else %}
                    <p class="text-danger">Ссылка недействительна или уже использована.</p>
                    <a href="{% url 'users:password_reset' %}" class="btn btn-primary">Запросить новую ссылку</a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
