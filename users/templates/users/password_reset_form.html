{% extends 'base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                <h3 class="text-center">Восстановление пароля</h3>
            </div>
            <div class="card-body">
                <p class="text-muted">Введите ваш email, и мы отправим инструкции для сброса пароля.</p>
                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_email" class="form-label">Email</label>
                        <input type="email" name="email" id="id_email" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Отправить</button>
                </form>
                <hr>
                <p class="text-center">
                    <a href="{% url 'users:login' %}">Вспомнили пароль?</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
